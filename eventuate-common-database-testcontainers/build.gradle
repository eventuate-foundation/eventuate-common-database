dependencies {
    api "io.eventuate.common.testcontainers:eventuate-common-testcontainers:$eventuateCommonTestcontainersVersion"
    api "org.testcontainers:testcontainers:$testContainersVersion"

    testImplementation project(":eventuate-common-spring-jdbc")
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc-test:$springBootVersion"
}


task writeProperties(type: WriteProperties) {
    outputFile "${project.buildDir}/generated/eventuate.common.database.version.properties"
    property 'version', version
}

processResources.from(writeProperties)

test {
    systemProperty "eventuate.common.database.version", version
    if (System.getenv("CIRCLECI") != null && System.getProperty("os.arch").toLowerCase().contains("aarch64")) {
        exclude '**/EventuateVanillaMsSqlContainerTest.class'
    }
    useJUnitPlatform()
}
